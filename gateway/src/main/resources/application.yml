server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      discovery:
        service-name: ${spring.application.name}
        health-check-path: /actuator/health
        health-check-interval: 10s
        instance-id: ${spring.application.name}-${random.uuid}
        prefer-ip-address: ${CONSUL_PREFER_IP:false}
        hostname: ${CONSUL_HOSTNAME:host.docker.internal}
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedHeaders:
                  - "*"
                allowedMethods:
                  - "GET"
                  - "POST"
                  - "PUT"
                  - "DELETE"
                  - "OPTIONS"
          routes:
            - id: profile
              uri: lb://profile
              predicates:
                - Path=/profiles, /profiles/**
            - id: rating
              uri: lb://rating
              predicates:
                - Path=/ratings, /ratings/**

management:
  endpoints:
    web:
      exposure:
        include: "health,info"