server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedHeaders:
                  - "*"
                allowedMethods:
                  - "GET"
                  - "POST"
                  - "PUT"
                  - "DELETE"
                  - "OPTIONS"
          routes:
            - id: profile
              uri: ${PROFILE_URI:http://localhost:8001}
              predicates:
                - Path=/profiles, /profiles/**
            - id: rating
              uri: ${RATING_URI:http://localhost:8002}
              predicates:
                - Path=/ratings, /ratings/**

management:
  endpoints:
    web:
      exposure:
        include: "health,info"