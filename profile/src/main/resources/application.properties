spring.application.name=profile
server.port=8001
spring.profiles.active=local
server.error.include-message=always

#navn andre bruker for å finne profile-service i konsul
spring.cloud.consul.discovery.service-name = ${spring.application.name}
#adressen consul spør for å sjekke om vi er healthy
spring.cloud.consul.discovery.health-check-path = /actuator/health
#hvor ofte consul sjekker
spring.cloud.consul.discovery.health-check-interval = 10s
#unsik Id per check, slik at to profil containere ikke overskriver hverandre
spring.cloud.consul.discovery.instance-id = ${spring.application.name}-${random.uuid}

spring.kafka.consumer.auto-offset-reset=earliest

