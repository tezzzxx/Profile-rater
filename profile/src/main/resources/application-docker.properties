spring.mongodb.uri=mongodb://mongo_profile:27017/profiles
spring.kafka.bootstrap-servers=kafka:9093

# når profile kjører i docker - i docker heter containeren "consul"
spring.cloud.consul.host=consul
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.prefer-ip-address=true
#registrerer seg selv i consul med ip-adressen istedet for containerId så gateaway og rating kan nå profile og to instanser for hver sin adresse

spring.config.import=optional:consul: