services:

  mongo_profile:
    image: mongo:7
    container_name: mongo_profile
    ports:
      - "27017:27017"
    volumes:
      - profile_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - m2026

  mongo_rating:
    image: mongo:7
    container_name: mongo_rating
    ports:
      - "27018:27017"
    volumes:
      - rating_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
        - m2026

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9091,HOST://:9092,DOCKER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - m2026

  consul:
    image: hashicorp/consul:2.0.0
    container_name: consul
    ports:
      - "8500:8500"
    command:
        - "agent"
        - "-dev"
        - "-node=m26"
        - "-client=0.0.0.0"
    healthcheck:
      test: [ "CMD", "consul", "members" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - m2026

  profile:
    image: profile:0.0.1-SNAPSHOT
    build:
        context: profile
    deploy:
      replicas: 2
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mongo_profile:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
        - m2026

  rating:
    image: rating:0.0.1-SNAPSHOT
    build:
      context: ./rating
    deploy:
      replicas: 2
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      mongo_rating:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - m2026

  gateway:
    image: gateway:0.0.1-SNAPSHOT
    build:
      context: ./gateway
    ports:
      - "8080:8080"
    environment:
      CONSUL_HOST: consul
      CONSUL_PREFER_IP: "true"
    depends_on:
      profile:
        condition: service_healthy
      rating:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - m2026

  frontend:
    image: frontend:0.0.1-SNAPSHOT
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - m2026


networks:
  m2026:
    name: m2026
    driver: bridge

volumes:
    profile_data:
    rating_data:
